services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educa360-backend
    # Vuelve a levantar solo tras un reinicio del equipo o un `docker compose down`
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Obligatorio: si no está definido, el contenedor NO arranca en vez
      # de caer en el secreto de desarrollo de application.properties.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Define APP_JWT_SECRET en .env (mínimo 32 bytes)}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      # CANTIDAD DE INTENTOS POR LOGIN (anti fuerza bruta)
      APP_SECURITY_LOGIN_MAX_ATTEMPTS: ${APP_SECURITY_LOGIN_MAX_ATTEMPTS:-5}
      APP_SECURITY_LOGIN_WINDOW_MINUTES: ${APP_SECURITY_LOGIN_WINDOW_MINUTES:-15}
      APP_SECURITY_LOGIN_COOLDOWN_MINUTES: ${APP_SECURITY_LOGIN_COOLDOWN_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: educa360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 127.0.0.1 delante del puerto: Postgres SÓLO se escucha desde esta máquina.
    # Sin ese prefijo se publicaría en todas las interfaces y, con una contraseña
    # débil, cualquiera en la red podría conectarse.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
